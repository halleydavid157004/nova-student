name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Reject unresolved merge markers in JavaScript
        run: |
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- '*.js'; then
            echo 'Unresolved merge markers found'
            exit 1
          fi
