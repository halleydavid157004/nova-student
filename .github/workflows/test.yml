name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Reject unresolved merge markers in JavaScript
        run: |
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- '*.js'; then
            echo 'Unresolved merge markers found'
            exit 1
          fi
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/launcher.test.js
  normalized-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nova_test
          POSTGRES_PASSWORD: nova-test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test real PostgreSQL migrations with synthetic fixtures
        env:
          # Disposable local database, never a Supabase project or account secret.
          NOVA_TEST_DATABASE_URL: postgresql://postgres:nova-test@127.0.0.1:5432/nova_test
        run: node --test test/normalized-sql.test.js
