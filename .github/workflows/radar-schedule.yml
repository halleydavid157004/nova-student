name: Radar cada 6 horas
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-radar-writer
  cancel-in-progress: false
jobs:
  radar:
    environment: Variables
    # Configured production environment; explicit false is the emergency stop.
    if: github.event.repository.private == false && vars.RADAR_ACTIONS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check private configuration before installing browsers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: test -n "$SUPABASE_URL" && test -n "$SUPABASE_SECRET_KEY" && test -n "$GROQ_API_KEY" && test -n "$BRAVE_SEARCH_API_KEY"
      - run: npm ci --prefix tools/browser
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('tools/browser/package-lock.json') }}
          restore-keys: chromium-${{ runner.os }}-
      - run: npx --prefix tools/browser playwright install --with-deps chromium
      - name: Discovery, validation, catalog and digests directly with Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          EMAIL_TOKEN_SECRET: ${{ secrets.EMAIL_TOKEN_SECRET }}
          PRIVACY_CONTROLLER: ${{ vars.PRIVACY_CONTROLLER }}
          PRIVACY_CONTACT_EMAIL: ${{ vars.PRIVACY_CONTACT_EMAIL }}
          LIVENESS_MAX_AGE_DAYS: ${{ vars.LIVENESS_MAX_AGE_DAYS || '14' }}
          BRAVE_MONTHLY_LIMIT: ${{ vars.BRAVE_MONTHLY_LIMIT || '600' }}
          SCAN_BATCH_SIZE: '30'
          LIVENESS_AI_CALLS_PER_CYCLE: '12'
          RADAR_ENGINE: actions
          WORKER_ENABLED: 'false'
        run: node tools/browser/radar.js
      - name: Build public static catalog
        if: vars.STATIC_PAGES_ENABLED == 'true'
        env:
          STATIC_BASE_URL: https://halleydavid157004.github.io/nova-student/
        run: node tools/static/build.js
      - name: Audit public HTML before publishing
        if: vars.STATIC_PAGES_ENABLED == 'true'
        run: node tools/browser/audit-catalog.js
      - uses: actions/upload-pages-artifact@v3
        if: vars.STATIC_PAGES_ENABLED == 'true'
        with:
          path: generated/site
          retention-days: 1

  pages:
    needs: radar
    if: vars.STATIC_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: nova-static-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  # Transitional wake-up is removed when the owner activates Actions.
  legacy-wake:
    if: github.event.repository.private == false && vars.RADAR_ACTIONS_ENABLED == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ejecutar y verificar el radar programado
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          base = 'https://nova-student-radar.onrender.com'
          deadline = time.monotonic() + 180
          def read(path):
              req = urllib.request.Request(base + path, headers={'User-Agent': 'NovaStudentScheduledRadar/1.0'})
              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.load(response)
          while time.monotonic() < deadline:
              try:
                  health = read('/api/health')
                  if not health.get('ok') or not health.get('storage', {}).get('ready') or health.get('storage', {}).get('error'):
                      raise ValueError('El almacenamiento aún no está listo')
                  if health.get('storage', {}).get('provider') != 'supabase':
                      raise SystemExit('Conecta Supabase para conservar el horario y el presupuesto entre reinicios.')
                  worker = read('/api/worker-status').get('worker', {})
                  brave = worker.get('brave', {})
                  if brave and (not worker.get('enabled') or not brave.get('enabled')):
                      raise SystemExit('Activa el worker y BRAVE_SEARCH_API_KEY en el servidor.')
                  if brave.get('budget', {}).get('remaining') == 0:
                      print('Radar protegido: se alcanzó el límite mensual de Brave. Sin nuevas consultas.')
                      break
                  run = brave.get('lastRun') or {}
                  expected_window = int((time.time() - 17 * 60) // (6 * 3600))
                  if not brave.get('running') and run.get('window') == expected_window:
                      if run.get('error'):
                          raise SystemExit('Brave terminó con un error: ' + str(run['error']))
                      print('Ciclo confirmado:', run.get('queriesUsed', 0), 'consultas y', run.get('discovered', 0), 'pistas nuevas.')
                      break
              except (urllib.error.URLError, TimeoutError, ValueError):
                  pass  # Render Free can take about a minute to start.
              time.sleep(10)
          else:
              raise SystemExit('No se pudo confirmar Brave. Revisa el último despliegue y /api/worker-status.')
          PY
