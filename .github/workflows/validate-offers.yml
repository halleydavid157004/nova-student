name: Validate offers with evidence
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-radar-writer
  cancel-in-progress: false
jobs:
  validate:
    if: github.event.repository.private == false && vars.RADAR_ACTIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tools/browser
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('tools/browser/package-lock.json') }}
      - run: npx --prefix tools/browser playwright install --with-deps chromium
      - name: Validate rows without waking Render
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RADAR_ENGINE: actions
          WORKER_ENABLED: 'false'
          SCAN_BATCH_SIZE: '30'
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SECRET_KEY" && test -n "$GROQ_API_KEY"
          node tools/browser/validate.js
